name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v1.2.3 or v1.2.3-rc.1
        required: true
        type: string
      publish:
        description: Publish the release and its channels. Off runs a dry run only
        required: false
        type: boolean
        default: false
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: scoutbin/spine/.github/workflows/go-release.yml@7725632bf918607c50f3dd36854f8af436999d7b # v0.0.0-20261114215816-7725632bf918
    with:
      tag: ${{ inputs.tag }}
      publish: ${{ inputs.publish }}
      homebrew-tap-app-client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
    secrets:
      homebrew-tap-app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
